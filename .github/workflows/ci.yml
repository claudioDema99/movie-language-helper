name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: make backend-sync
      - name: Run backend quality gate
        run: make backend-check
      - name: Run corpus and configured-limit performance gates
        run: make quality-corpus performance-smoke
      - name: Audit Python dependencies
        run: cd backend && uv audit --preview

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: make frontend-sync
      - name: Install browser for end-to-end tests
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run frontend quality gate
        run: make frontend-check
      - name: Audit frontend dependencies
        run: cd frontend && npm audit --audit-level=high

  containers:
    name: Reproducible containers
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build backend runtime image
        run: docker build --pull --tag movie-language-helper-backend:test backend
      - name: Build frontend runtime image
        run: docker build --pull --tag movie-language-helper-frontend:test frontend
