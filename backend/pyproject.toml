[project]
name = "movie-language-helper-backend"
version = "0.1.0"
description = "Backend API for Movie Language Helper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pysubs2>=1.8,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "movie_language_helper"

[tool.uv]
required-version = "==0.12.6"

[tool.pytest.ini_options]
addopts = [
    "-p",
    "pytest_cov",
    "--strict-config",
    "--strict-markers",
    "--cov=movie_language_helper",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]
markers = [
    "live: explicitly gated tests that call paid or third-party services",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true
